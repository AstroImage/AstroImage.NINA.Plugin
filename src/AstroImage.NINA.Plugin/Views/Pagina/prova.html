<!doctype html>
<meta charset="utf-8">
<title>AstroImage Strategy</title>
<link rel="stylesheet" href="prova.css">

<!--
  QUI DENTRO NON C'E' UNA PAROLA, e non e' una svista.

  Ogni testo che si legge sullo schermo sta nei due file delle lingue, e qui c'e' solo
  il nome della chiave: data-loc dice quale. Aprendo questo file in un browser si
  vedono i nomi delle chiavi al posto delle frasi, ed e' giusto cosi' — vuol dire che
  non ne e' rimasta nessuna scritta a mano.

  La regola vale anche per il futuro: nessuna stringa nuova deve mescolare prosa e
  markup. Il testo sta nel dizionario, la struttura qui.
-->

<!--  IN CIMA A TUTTO, QUANDO IL MOTORE NON RISPONDE (17 settembre 2026). Chi installa il plugin vede questo pannello
      prima di ogni altra cosa: senza motore la domanda non ha risposta, e un pannello che non spiega perche' sembra
      rotto. Qui prova.js scrive l'avviso con l'indirizzo che sta interrogando, dove si cambia, e il tasto per
      riprovare. Vuoto quando il motore risponde. -->
<div id="avviso"></div>

<!--  LA DOMANDA, COME IN AIS (17 settembre 2026): «Cosa vuoi riprendere» con la lente e «Pulisci», la notte
      di riferimento con la Luna sotto la data, e il tasto — su una riga sola, con le stesse didascalie. Le parole, i
      suggerimenti e il segnaposto li mette prova.js dal dizionario; la Luna la calcola Strategy. -->
<div class="domanda">
  <div class="campo-oggetto">
    <label class="didascalia" for="oggetto" data-loc-title="Pag_CosaVuoiRiprendereNota">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span data-loc="Pag_CosaVuoiRiprendere"></span> <span class="ico">i</span></label>
    <!-- L'oggetto si trova mentre si scrive, come in AIS: l'elenco sotto il campo lo riempie prova.js con le
         corrispondenze del servizio. Niente completamento del browser: i nomi scritti in passato coprirebbero il
         catalogo. Il campo parte vuoto, come in AIS. -->
    <div class="cerca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.6"/><path d="m15.4 15.4 4.6 4.6"/></svg>
      <input id="oggetto" spellcheck="false" list="elencoOggetti" autocomplete="off" data-loc-placeholder="Pag_OggettoEsempio">
      <button type="button" id="pulisci" hidden data-loc="Pag_Pulisci" data-loc-title="Pag_PulisciNota"></button>
    </div>
    <datalist id="elencoOggetti"></datalist>
  </div>
  <div class="notte-rif">
    <label class="didascalia" for="data" data-loc-title="Pag_NotteDiRiferimentoNota"><span data-loc="Pag_NotteDiRiferimento"></span></label>
    <!-- La data NON ha un valore qui dentro: lo mette prova.js, ed e' oggi. Una data
         cablata nel markup e' una data che mente il giorno dopo, e la Luna si calcola
         su quella. -->
    <!-- Il calendario come in AIS: l'icona e' disegnata qui, perche' nella pagina non entra nessun indirizzo, nemmeno
         quello di un'icona incorporata; il tasto nativo le sta sotto, trasparente, e il clic arriva a lui. -->
    <span class="data-cal"><input id="data" type="date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>
    <div class="luna-notte" id="lunaNotte"></div>
  </div>
  <div class="azione">
    <button id="vai" data-loc="Pag_ChiediPrescrizione"></button>
    <span id="stato" class="stato" data-loc="Pag_InAttesa"></span>
  </div>
</div>

<!--  LA DOMANDA — le tre cose che decide chi riprende, non il programma.

      Quante notti, e se il progetto e' il soggetto intero o una sua inquadratura.
      Cambiano il piano e il totale, e finora il Ponte ne mandava valori scritti nel
      codice che nessun utente aveva scelto: tre notti sempre, e la copertura mai
      dichiarata — che il motore legge come «soggetto completo», il caso caro.

      Struttura identica a quella di AIS, perche' e' la stessa domanda: se le due
      pagine la chiedessero in due modi diversi, la stessa prescrizione avrebbe due
      volti. Le parole stanno nel dizionario, come tutto il resto di questo file.  -->
<div class="hero-row">
  <div class="hero-cov">
    <div class="hc-k" data-loc="Pag_CoperturaDelSoggetto"></div>
    <div class="hc-seg" role="radiogroup">
      <label><input type="radio" name="cov" id="covFull" value="full" checked>
        <span data-loc="Pag_SoggettoCompleto"></span></label>
      <label><input type="radio" name="cov" id="covFrame" value="framing">
        <span data-loc="Pag_InquadraturaLibera"></span></label>
    </div>
  </div>
  <label class="f hero-num"><span data-loc="Pag_InQuanteNotti"></span>
    <input type="number" id="notti" step="1" min="1" max="60" value="3"></label>
</div>

<div id="modi"></div>
<div id="politiche"></div>
<!--  I progetti aperti su questo profilo (26 settembre 2026): sempre visibili, anche prima di chiedere. -->
<div id="progettiAperti"></div>
<!--  IL CUORE DEL PONTE STA QUI (17 settembre 2026): subito sotto la domanda, la tecnica di ripresa e le notti da
      mandare a N.I.N.A.; poi il resto della risposta; in fondo sito, banco e filtri, che una volta dichiarati non
      devono stare fra l'occhio e la scelta. -->
<div id="uscita"></div>
<div id="dettagli"></div>
<div id="sito"></div>
<div id="banco"></div>
<!-- Le voci del banco, per sceglierle col pezzo scollegato: le riempie prova.js con quelle del servizio. -->
<datalist id="voci-ottica"></datalist>
<datalist id="voci-camera"></datalist>
<datalist id="voci-montatura"></datalist>
<div id="filtri"></div>

<!-- Le parole entrano qui: le mette l'ospite, nella lingua che vale adesso. -->
<!--voci-->
<script src="prova.js"></script>
